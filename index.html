<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tecno Hockey Quizz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --naranja: #EDA600; --oscuro: #2B2B2B; --claro: #F5F5F5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: #fff; color: var(--oscuro); font-family: Calibri, Carlito, system-ui, sans-serif; }
    main { max-width: 420px; width: 100%; text-align: center; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    h1 span { color: var(--naranja); }
    p { font-size: 1.15rem; line-height: 1.4; margin: 0 0 24px; }
    .fase { background: var(--claro); border-left: 6px solid var(--naranja); padding: 16px; text-align: left; font-size: 1.05rem; }
  </style>
</head>
<body>
  <main>
    <h1>Tecno <span>Hockey</span> Quizz</h1>
    <p>Cuestionarios de clase · Deportes Colectivos II</p>
    <div class="fase">En construcción. Fase 1 de 5 lista: base de datos y seguridad. La pantalla del alumno llega en la fase 2.</div>
  </main>
</body>
</html>
