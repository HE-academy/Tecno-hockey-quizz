name: Mantener Supabase activo

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin actividad.
# Una consulta diaria a la base lo evita.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consulta a la base de datos
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/hora_servidor" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo

      # GitHub desactiva los cron de repos sin commits en 60 días; reactivarlo
      # por API reinicia ese plazo sin ensuciar el historial con commits vacíos.
      - name: Evitar que GitHub desactive este cron
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
