<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1B2C"/>
      <stop offset=".55" stop-color="#173246"/>
      <stop offset="1" stop-color="#1E4A44"/>
    </linearGradient>
    <linearGradient id="cesped" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F5E3C"/>
      <stop offset="1" stop-color="#2F8550"/>
    </linearGradient>
    <radialGradient id="foco" cx=".35" cy=".78" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bola" cx=".38" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".7" stop-color="#ECECEC"/>
      <stop offset="1" stop-color="#BDBDBD"/>
    </radialGradient>
    <linearGradient id="palo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2F38"/>
      <stop offset="1" stop-color="#0D1015"/>
    </linearGradient>
    <filter id="desenfoque"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="800" height="900" fill="url(#cielo)"/>
  <!-- grada y focos desenfocados -->
  <g filter="url(#desenfoque)" opacity=".55">
    <rect x="0" y="330" width="800" height="120" fill="#24435A"/>
    <circle cx="120" cy="120" r="26" fill="#F2C14E" opacity=".5"/>
    <circle cx="520" cy="90" r="20" fill="#F2C14E" opacity=".4"/>
    <circle cx="700" cy="150" r="16" fill="#FFFFFF" opacity=".3"/>
    <rect x="380" y="250" width="60" height="140" rx="20" fill="#3A5872"/>
    <rect x="600" y="270" width="50" height="120" rx="18" fill="#3A5872"/>
  </g>

  <!-- césped con franjas en perspectiva -->
  <path d="M0 440 L800 420 L800 900 L0 900 Z" fill="url(#cesped)"/>
  <g fill="#FFFFFF" opacity=".05">
    <path d="M0 470 L800 452 L800 500 L0 522 Z"/>
    <path d="M0 580 L800 556 L800 618 L0 646 Z"/>
    <path d="M0 720 L800 690 L800 770 L0 806 Z"/>
  </g>
  <path d="M0 640 L800 604" stroke="#FFFFFF" stroke-width="5" opacity=".35"/>
  <rect width="800" height="900" fill="url(#foco)"/>

  <!-- stick -->
  <path d="M640 -40 L318 690" stroke="url(#palo)" stroke-width="34" stroke-linecap="round"/>
  <path d="M640 -40 L560 142" stroke="#EDA600" stroke-width="36" stroke-linecap="round"/>
  <path d="M600 52 L590 74 M584 88 L574 110 M568 124 L558 146" stroke="#B87F00" stroke-width="6"/>
  <path d="M318 690 C 300 732, 262 760, 222 752 C 196 747, 192 724, 214 714 C 240 703, 268 700, 290 676 Z" fill="#11151B"/>
  <path d="M296 700 C 280 726, 254 742, 226 740" stroke="#EDA600" stroke-width="5" fill="none" opacity=".9"/>

  <!-- bola y salpicadura -->
  <ellipse cx="168" cy="792" rx="46" ry="10" fill="#000" opacity=".35"/>
  <circle cx="168" cy="752" r="40" fill="url(#bola)"/>
  <g fill="#C9C9C9">
    <circle cx="152" cy="738" r="4"/><circle cx="174" cy="732" r="4"/><circle cx="188" cy="752" r="4"/>
    <circle cx="160" cy="760" r="4"/><circle cx="178" cy="774" r="3.5"/><circle cx="144" cy="776" r="3"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="246" cy="772" r="3" opacity=".8"/><circle cx="268" cy="760" r="2" opacity=".7"/>
    <circle cx="282" cy="780" r="2.5" opacity=".6"/><circle cx="300" cy="768" r="1.8" opacity=".6"/>
    <circle cx="258" cy="790" r="2" opacity=".7"/><circle cx="312" cy="790" r="1.5" opacity=".5"/>
    <circle cx="236" cy="796" r="1.6" opacity=".7"/><circle cx="326" cy="776" r="1.4" opacity=".5"/>
  </g>
</svg>
